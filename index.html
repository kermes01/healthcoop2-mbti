<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>함께걸음 조합원 성향 테스트</title>
  <style>
    :root {
      --primary: #2B7A78;
      --primary-light: #DEF2F1;
      --primary-dark: #17252A;
      --accent: #3AAFA9;
      --bg: #F8FAF9;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --text-muted: #718096;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 680px; margin: auto; }
    
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 34px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    
    /* Intro */
    .intro { text-align: center; }
    .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 5px 14px; border-radius: 20px; font-weight: 700; font-size: 0.88rem; margin-bottom: 14px; }
    h1 { font-size: 1.65rem; color: var(--primary-dark); margin-bottom: 12px; word-break: keep-all; }
    p.desc { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 26px; word-break: keep-all; }
    .start-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(43, 122, 120, 0.25);
    }
    .start-btn:hover { background: var(--accent); transform: translateY(-2px); }

    /* Test Area */
    #test-area { display: none; }
    .progress-bar-container {
      background: #EDF2F7;
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--primary));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .part-title { font-size: 0.92rem; color: var(--primary); font-weight: 700; }
    .q-count { font-size: 0.88rem; color: var(--text-muted); font-weight: 700; }
    .q-text { font-size: 1.18rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 24px; word-break: keep-all; line-height: 1.5; }
    
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      word-break: keep-all;
      line-height: 1.5;
    }
    @media (hover: hover) and (pointer: fine) {
      .option-btn:hover {
        border-color: var(--accent);
        background-color: var(--primary-light);
        transform: translateY(-1px);
      }
    }
    .option-btn:focus, .option-btn:focus-visible {
      outline: none;
      background-color: #fff;
      border-color: var(--border);
      transform: none;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }
    .option-btn .opt-badge {
      font-weight: 800;
      color: var(--primary);
      background: #E6FFFA;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Result Area */
    #result-area { display: none; text-align: center; }
    .result-header { margin-bottom: 22px; }
    .result-badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .result-title { font-size: 1.75rem; color: var(--primary-dark); margin-bottom: 8px; font-weight: 800; }
    .result-summary { color: #4A5568; font-size: 1.05rem; margin-bottom: 24px; word-break: keep-all; font-weight: 600; }
    
    .score-breakdown {
      display: flex;
      justify-content: space-around;
      background: #F7FAFC;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .score-item { font-size: 0.85rem; color: var(--text-muted); }
    .score-item strong { display: block; font-size: 1.1rem; color: var(--primary-dark); margin-top: 4px; }
    
    .section-box {
      text-align: left;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section-box h3 {
      font-size: 1.05rem;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-box ul { padding-left: 20px; color: #4A5568; }
    .section-box li { margin-bottom: 8px; word-break: keep-all; font-size: 0.98rem; }

    .restart-btn {
      margin-top: 14px;
      background: #EDF2F7;
      color: var(--text);
      border: none;
      padding: 13px 30px;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .restart-btn:hover { background: #E2E8F0; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. Intro Screen -->
  <div id="intro-area" class="card intro">
    <span class="badge">함께걸음의료복지사회적협동조합</span>
    <h1>조합원 성향 테스트</h1>
    <p class="desc">
      나의 조합 활동 캐릭터를 33개 문항으로 가볍게 알아보고,<br>
      함께걸음에서 나와 꼭 맞는 활동과 모임을 찾아보세요!
    </p>
    <button class="start-btn" onclick="startTest()">테스트 시작하기</button>
  </div>

  <!-- 2. Test Question Screen -->
  <div id="test-area" class="card">
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <div class="q-meta">
      <span id="part-title" class="part-title">Part 1. 만남과 에너지</span>
      <span class="q-count"><span id="curr-q">1</span> / 33</span>
    </div>
    <div id="q-text" class="q-text">질문 내용이 여기에 들어옵니다.</div>
    <button id="btn-optA" class="option-btn" onclick="selectOption('A')">
      <span class="opt-badge">A</span>
      <span id="optA-text">선택지 A 내용</span>
    </button>
    <button id="btn-optB" class="option-btn" onclick="selectOption('B')">
      <span class="opt-badge">B</span>
      <span id="optB-text">선택지 B 내용</span>
    </button>
  </div>

  <!-- 3. Result Screen -->
  <div id="result-area" class="card">
    <div class="result-header">
      <span class="badge">나의 조합 캐릭터</span><br>
      <div id="res-code" class="result-badge">EFP</div>
      <h2 id="res-title" class="result-title">햇살 같은 분위기 메이커</h2>
      <p id="res-summary" class="result-summary">사람과 웃음이 있는 곳이라면 어디든 달려가는 활력소</p>
    </div>

    <div class="score-breakdown">
      <div class="score-item">만남과 에너지<strong id="score-e">E 성향</strong></div>
      <div class="score-item">판단과 소통 기준<strong id="score-t">F 성향</strong></div>
      <div class="score-item">활동 진행 방식<strong id="score-j">P 성향</strong></div>
    </div>

    <div class="section-box">
      <h3>✨ 이런 성향을 가지고 계시네요</h3>
      <ul id="res-traits"></ul>
    </div>

    <div class="section-box">
      <h3>🤝 찰떡궁합 추천 조합 활동</h3>
      <ul id="res-activities"></ul>
    </div>

    <button class="restart-btn" onclick="restartTest()">다시 검사하기</button>
  </div>
</div>

<script>
const questions = [
  // Part 1: 만남과 에너지 (1 ~ 11) -> E vs I
  { part: "Part 1. 만남과 에너지", q: "1. 조합 행사에 참여한 나의 모습은?", a: "누구 반가운 얼굴 없나~ 먼저 다가가서 여기저기 인사 나누고 수다를 떨고 있다.", b: "수줍게 인사한 뒤, 조용한 자리에서 편한 사람들과 가벼운 담소를 나누고 있다.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "2. 조합 단체 대화방(밴드/단톡방)에 새로운 공지가 떴을 때 나는?", a: "바로바로 반응하며 호응하거나, 이모티콘, 하트, 엄지척 리액션이라도 달아준다.", b: "내용을 조용히 확인하고 마음속으로 '좋아요'를 누른다.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "3. 걷기 소모임에 나가고 싶은데 방법을 모를때는?", a: "조합사무국 담당자에게 연락해서 소모임장 연락처를 받는다.", b: "주변 지인중에 모임하는 사람은 없는지 살펴본다.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "4. 이런 저런 활동과 모임등에 너무 많이 참여하고 있는 나를 자각하게 된다면?", a: "모임하나 정도는 줄여야 하나 고민한다.", b: "그만둔다는 말을 못해서 힘들지만 계속 활동한다.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "5. 총회 같은 조합의 큰 행사가 끝난 후 뒷풀이는?", a: "행사의 꽃은 뒷풀이지~ 필참!", b: "행사참석까지만... 난 할일 다 했으니 집으로 가자!", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "6. 조합 활동 중 좋은 아이디어가 번쩍 떠올랐을 때?", a: "김민수 이사장(최봉섭 전무나 사무국 직원)을 만나면 아이디어를 전달한다.", b: "친한 조합원에게 ‘이런건 어때?’하며 이야기한다.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "7. 조합 행사에 꼭 하나 역할을 맡아야 한다면?", a: "접수대에서 1시간 동안 조합원을 응대하는 역할", b: "행사 1시간 전에 도착해서 무대를 꾸미는 역할", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "8. 가입한 지 얼마 안 된 새 조합원이 적응할 때 필요한 것은?", a: "조합원과 어울릴 수 있는 각종 모임에 대한 참석 기회 제공", b: "차근 차근 조합에 대해 알아갈 수 있도록 정보 제공", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "9. 모임 도중 잠시 10분의 쉬는 시간이 주어졌을 때 옆자리 조합원님이 간식을 건내준다면?", a: "간식을 함께 먹으며 스몰 토크 시작", b: "간식을 고맙게 받고 난 뭔가 드릴게 없나 가방을 뒤적뒤적", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "10. 내가 선호하는 조합 소모임의 규모는?", a: "10~20명 이상 모여서 왁자지껄 북적이는 대규모 모임.", b: "3~5명 정도 모여 깊은 이야기를 나눌 수 있는 아담한 모임.", optA: "E", optB: "I" },
  { part: "Part 1. 만남과 에너지", q: "11. 조합에 대한 애정이 가장 샘솟는 순간은?", a: "다양한 사람들과 어울리며 함께 환호하고 연대감을 느낄 때.", b: "활동중에 마음이 통하는 사람을 만났을 때.", optA: "E", optB: "I" },

  // Part 2: 판단과 소통 기준 (12 ~ 22) -> T vs F
  { part: "Part 2. 판단과 소통 기준", q: "12. 조합 활동 중 이견이 생겨 논쟁이 벌어졌을 때 나는?", a: "회칙, 객관적인 데이터를 통한 공정함과 효율성이 가장 중요하다.", b: "효율적이지는 않더라도 누구 하나 마음 상하지 않는 결정을 한다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "13. 열심히 준비한 행사에서 뜻밖의 실수가 발생했을 때?", a: "“원인이 뭐지?” 대책과 수습 방법부터 빠르게 찾는다.", b: "실수로 침체된 분위기를 먼저 끌어올린 후 수습한다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "14. 친한 조합원이 고민 상담을 해왔을 때는?", a: "나의 경험을 토대로 도움이 되는 현실적인 대안을 조언해 준다.", b: "커피한잔 사주며 고민을 충분히 들어주고 위로해 준다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "15. 총회에서 조합 예산 결산안을 살펴볼 때 내 시선이 먼저 가는 곳은?", a: "숫자가 정확히 맞는지, 지출 대비 사업 성과가 분명한지.", b: "예산이 조합의 활동가치에 맞게, 필요한 곳에 골고루 쓰였는지.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "16. 조합원으로서 다른 사람에게 듣고 싶은 최고의 칭찬은?", a: "“어쩜 이렇게 일을 똑부러지게 잘하세요? 정말 대단해요!”", b: "‘저 OO조합원님 보고 싶어서 모임에 또 나왔어요!’", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "17. 조합 모임에 계속 늦는 조합원이 있다면?", a: "늦는 이유를 물어보고, 시간이 안되면 모임날짜 변경을 제안한다.", b: "늦는 조합원에 대해 신경이 쓰이지만, 전체 분위기를 위해 참고 넘긴다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "18. 이사장에게 모임의 장을 제안 받았을 때 여건상 승낙하기 어렵다면?", a: "할 수 있는지 냉정히 따져보고 정확히 거절한다.", b: "거절하지도 승낙하지도 못하고 한참 고민하다가 결국 설득당해 승낙한다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "19. 조합의 새로운 규칙을 정할 때 가장 중요한 것은?", a: "누구에게나 공정하고 투명하게 적용되는 원칙.", b: "취약하거나 사정이 어려운 분들을 배려하는 유연함.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "20. 다른 조합원의 활동이 문제가 있어 어쩔 수 없이 지적해야 할 때는?", a: "고쳐야 할 점을 솔직하고 명확하게 짚어주는 것이 진짜 그 사람을 위하는 것이다.", b: "상대방이 바로 고쳐지지 않더라도 상처받지 않도록 이야기 하는 것이 중요하다.", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "21. 조합에서 어떤 새 사업을 추진할 때 더 중요한 기준은?", a: "적절한 예산과 인력으로 효과적인 운영이 가능한가?", b: "지역사회와 조합원들에게 보람과 행복을 가져오는가?", optA: "T", optB: "F" },
  { part: "Part 2. 판단과 소통 기준", q: "22. 모임이 끝나고 집에 갈 때 보람을 느끼는 순간은?", a: "오늘 계획했던 안건과 일처리가 군더더기 없이 끝났다!", b: "오늘 참여한 사람들 표정이 다들 밝고 훈훈했다!", optA: "T", optB: "F" },

  // Part 3: 활동 진행 방식 (23 ~ 33) -> J vs P

let currentIdx = 0;
let scores = { E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 };

function startTest() {
  document.getElementById('intro-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('test-area').style.display = 'block';
  currentIdx = 0;
  scores = { E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 };
  showQuestion();
}

function showQuestion() {
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  const btnA = document.getElementById('btn-optA');
  const btnB = document.getElementById('btn-optB');
  if (btnA) btnA.classList.remove('selected');
  if (btnB) btnB.classList.remove('selected');

  const item = questions[currentIdx];
  document.getElementById('curr-q').innerText = currentIdx + 1;
  document.getElementById('part-title').innerText = item.part;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('optA-text').innerText = item.a;
  document.getElementById('optB-text').innerText = item.b;

  const progressPct = ((currentIdx) / questions.length) * 100;
  document.getElementById('progress').style.width = progressPct + '%';
}

function selectOption(choice) {
  // Remove focus from button so it doesn't stay highlighted
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  const btnA = document.getElementById('btn-optA');
  const btnB = document.getElementById('btn-optB');
  if (choice === 'A') btnA.classList.add('selected');
  if (choice === 'B') btnB.classList.add('selected');

  const item = questions[currentIdx];
  const selectedCode = (choice === 'A') ? item.optA : item.optB;
  scores[selectedCode]++;

  // Brief smooth transition to show click before resetting and moving to next
  setTimeout(() => {
    btnA.classList.remove('selected');
    btnB.classList.remove('selected');
    currentIdx++;
    if (currentIdx < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 120);
}

function showResult() {
  document.getElementById('test-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';

  const eType = (scores.E >= scores.I) ? 'E' : 'I';
  const tType = (scores.T >= scores.F) ? 'T' : 'F';
  const jType = (scores.J >= scores.P) ? 'J' : 'P';
  const resultCode = eType + tType + jType;

  const data = resultsData[resultCode];

  document.getElementById('res-code').innerText = resultCode;
  document.getElementById('res-title').innerText = data.title;
  document.getElementById('res-summary').innerText = data.summary;

  document.getElementById('score-e').innerText = `${eType} 성향 (${scores.E} : ${scores.I})`;
  document.getElementById('score-t').innerText = `${tType} 성향 (${scores.T} : ${scores.F})`;
  document.getElementById('score-j').innerText = `${jType} 성향 (${scores.J} : ${scores.P})`;

  const traitsUl = document.getElementById('res-traits');
  traitsUl.innerHTML = '';
  data.traits.forEach(t => {
    const li = document.createElement('li');
    li.innerText = t;
    traitsUl.appendChild(li);
  });

  const actUl = document.getElementById('res-activities');
  actUl.innerHTML = '';
  data.activities.forEach(a => {
    const li = document.createElement('li');
    li.innerText = a;
    actUl.appendChild(li);
  });
}

function restartTest() {
  startTest();
}
